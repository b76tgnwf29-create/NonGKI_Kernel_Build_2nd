# OnePlus 8T (kebab) · 最强内核构建配置  v3（风险归零版）
#
# 配套：NonGKI_Kernel_Build_2nd · sample 分支
# 目标：SukiSU-Ultra + SUSFS v2.2.00 + KPM + NoMount + Baseband Guard
# 设备：KB2000 / A11 / 4.19.110-perf+ / boot 96 MiB
#
# ── 使用方法 ──
# 1. fork https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd
# 2. 切到 sample 分支
# 3. 把本文件放到 .github/workflows/build-kebab.yml，ikconfig.py 放到仓库根目录
# 4. 把原厂 boot.img 改名 stock_boot.img 放仓库根目录（**必须**，它是版本串与 defconfig 的唯一来源）
# 5. Actions → Build OnePlus 8T Kernel → Run workflow → profile=full
#
# ── v3 相比 v2 的变化（全部为"把风险变无风险"）──
# · 版本串不再写死：从 stock_boot.img 里读 `Linux version ...`，读不到才回落默认值并告警
# · 新增 ③-P  profile 一键降级（full / no-kpm / safe-defconfig），不改文件
# · 新增 ④-E  开编前预检闸门：defconfig / 模块签名 / kallsyms / 版本串 / 补丁，任一项不合格直接停
# · 新增 ⑤-R  SUSFS 拒块摘要：.rej 不再静默，落成 rej-summary.txt
# · 新增 ⑫-G  产物闸门：Image 大小 / 版本串是否真进内核 / 模块签名是否真关，不合格**不打包**
# · 新增 ⑬-V  打包后校验：产物 sha256 与内部 Image 大小
# · 新增 ⑮    失败摘要：一次失败就带齐定位材料，不用多轮试
# · 16 个裸布尔 env 全部加引号，消除 `== "true"` 比较的类型歧义

name: Build OnePlus 8T Kernel

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '构建档位：full=全量 / no-kpm=KPM 编译失败时降级 / safe-defconfig=提不到 defconfig 时兜底'
        required: true
        default: 'full'
        type: choice
        options: ['full', 'no-kpm', 'minimal', 'no-bbg', 'no-nomount', 'no-kpm2', 'safe-defconfig']
      debug_mode:
        description: 'BUILD_DEBUGGER（首次建议 false；true 遇 .rej 会直接失败）'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
  # 兜底触发器：GitHub 只允许在**默认分支**上手动 dispatch workflow。
  # 这个仓库默认分支是 mainline，而 workflow 在 sample 上 —— 手动按钮不出现。
  # 所以加一个 push 触发：改 trigger.txt 即开跑，不需要改默认分支、不需要 token。
  push:
    branches: [sample]
    paths:
      - 'trigger.txt'

env:
  # ══════════════════ 设备 ══════════════════
  DEVICE_NAME     : "OnePlus 8T"
  DEVICE_CODENAME : "kebab"
  # boot 分区 96 MiB（100663296 B），留 2 MiB 给 header/AVB
  BOOT_PARTITION_BYTES : "100663296"
  BOOT_IMAGE_BUDGET    : "98566144"

  # ══════════════════ 内核源码（已实查）══════════════════
  KERNEL_SOURCE : "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "oneplus/SM8250_R_11.0"

  # ══════════════════ 编译器 ══════════════════
  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""
  GCC_GNU      : "false"
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  # ══════════════════ 内核配置 ══════════════════
  # 不用 DEFCONFIG_FROM_BOOT（上游那段逻辑死锁），改为本地/流水线自行提取
  DEFCONFIG_SOURCE      : ""
  DEFCONFIG_NAME        : "vendor/kebab_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT   : "false"
  BOOT_SOURCE           : ""

  # ══════════════════ Root：SukiSU-Ultra ══════════════════
  # ★ 不要选 bakasu：main 分支 commit 48fa4bb7 在 susfs_compat.mk 写死 $(error ...)
  KERNELSU_SOURCE   : ""
  KERNELSU_BRANCH   : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK: "sukisu"
  KERNELSU_METHOD   : "manual"
  # ★ 4.19 厂商内核必须 syscall，kprobe 会误触发 Safe Mode
  HOOK_METHOD       : "syscall"

  # ══════════════════ SUSFS v2.2.00 ══════════════════
  SUSFS_ENABLE: "true"
  SUSFS_FIXED : "false"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED : ""

  PATCHES_SOURCE: "https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git"
  PATCHES_BRANCH: "sample"

  # ══════════════════ KPM（SukiSU 独有）══════════════════
  KPM_ENABLE      : "true"
  KPM_INLINE      : "true"    # YAML 原注：Only use it for SukiSU-Ultra
  KPM_KPATCH_NEXT : "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  # ══════════════════ 额外部件 ══════════════════
  NOMOUNT_ENABLE        : "true"    # 模块走 VFS 注入，/proc/mounts 干净
  BASEBAND_GUARD_ENABLE : "true"    # 阻止对 modem/persist 的未授权写入
  BASEBAND_GUARD_BOOT   : "true"    # 额外保护 boot 分区
  DROIDSPACES_ENABLE    : "false"   # LXC/Docker，用不到
  REKERNEL_ENABLE       : "false"   # 与 SUSFS 有重叠，别同时开

  # ══════════════════ 打包 ══════════════════
  AK3_SOURCE  : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH  : "master"
  PACK_METHOD : "AnyKernel3"
  PACK_KMODULES: "false"
  NEED_DTBO      : "false"
  NEED_SAFE_DTBO : "false"
  GENERATE_DTB   : "false"
  GENERATE_CHIP  : "qcom"
  ROM_TEXT       : "rom_android"

  # ══════════════════ 构建选项 ══════════════════
  CUSTOM_CMDS   : "CLANG_TRIPLE=aarch64-linux-gnu-"
  # 用交叉工具链自带的 GNU ld，不用 ld.lld。
  # 原因（run 22 实测）：4.19 的 fs/open.c、fs/stat.c、fs/exec.o 里存在
  #   relocation R_AARCH64_LDST32_ABS_LO12_NC ... not aligned to 4 bytes
  # 这是 LLD 的严格对齐检查，而 4.19 时代的代码是按 GNU ld 的宽容行为写的
  # （GNU ld 会对这类地址自动做对齐补偿）。换 GNU ld 即解，不必改源码。
  EXTRA_CMDS    : "LLVM_IAS=1"
  PYTHON_VERSION: "3"
  # 首次如果因为 .rej 直接失败，保持 false 让构建继续；稳定后再改 true
  BUILD_DEBUGGER: "false"
  SKIP_PATCH    : "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config"
  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Build OnePlus 8T Kernel (SukiSU + SUSFS + KPM)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ① Checkout（拉 workflow 与 Patches）
        uses: actions/checkout@v6

      - name: ② 准备编译环境（装 clang/gcc/依赖）
        uses: ./.github/workflows/build-env

      - name: ③ 拉内核源码 + 工具 + defconfig
        uses: ./.github/workflows/build-ready

      # ── 档位覆写：必须在任何使用前生效 ──
      - name: ③-P profile 覆写（一键降级，不改文件）
        shell: bash
        run: |
          set -e
          # ★ 2026-11-16：档位来源优先级
          #   1) workflow_dispatch 的 inputs.profile（手点 Run workflow 时）
          #   2) trigger.txt 首行里的 "profile=xxx"（push 触发路径，默认分支不是 sample，
          #      手动按钮不出现，只能用 trigger.txt 兜底；这行让我们也能指定档位）
          #   3) 回落 safe-defconfig
          PROFILE="${{ inputs.profile }}"
          if [ -z "$PROFILE" ] && [ -f "$GITHUB_WORKSPACE/trigger.txt" ]; then
            PROFILE=$(head -1 "$GITHUB_WORKSPACE/trigger.txt" | tr -d '\r' | sed -n 's/.*profile=\([a-z-]*\).*/\1/p')
            [ -n "$PROFILE" ] && echo "[+] profile 来自 trigger.txt: $PROFILE"
          fi
          [ -z "$PROFILE" ] && PROFILE="safe-defconfig"
          echo "::group::[+] profile = $PROFILE"
          case "$PROFILE" in
            full)
              echo "[+] full：SUSFS + KPM inline + kebab_defconfig"
              ;;
            no-kpm)
              echo "KPM_INLINE=false" >> "$GITHUB_ENV"
              echo "[+] no-kpm：KPM 不进 inline hook，sus_map 仍在（frida 检测照样能过）"
              ;;
            minimal)
              # ★ 2026-11-16 新增：二分定位内核起不来的凶手。
              # run31 已修好 vermagic（实测产物 = 4.19.110-perf+ SMP preempt mod_unload
              # modversions aarch64，与原厂 .ko 逐字一致），但 fastboot boot 仍掉 EDL。
              # config 逐项对比只剩预期差异（MODULE_SIG 关掉 + 19 项 KSU/SUSFS 新增），
              # 内存布局/加固项全部相同 → 问题只可能在四个补丁组件里：
              #   KSU（含 SUSFS）· KPM · NoMount · Baseband Guard
              # 本档把这四个全关，只保留：版本串伪装 + defconfig + 标准内核。
              # 判定逻辑：
              #   minimal 能起 → 凶手在这四个里，逐个加回（最多 4 轮）即可定位
              #   minimal 也崩 → 不是组件问题，是内核基础/工具链问题（走别的线）
              echo "SUSFS_ENABLE=false"            >> "$GITHUB_ENV"
              echo "KPM_INLINE=false"              >> "$GITHUB_ENV"
              echo "NOMOUNT_ENABLE=false"          >> "$GITHUB_ENV"
              echo "BASEBAND_GUARD_ENABLE=false"   >> "$GITHUB_ENV"
              echo "BASEBAND_GUARD_BOOT=false"     >> "$GITHUB_ENV"
              echo "[+] minimal：KSU/SUSFS/KPM/NoMount/BBG 全关，只验内核本体能不能起"
              ;;
            no-bbg)
              # ★ 2026-11-16：二分第 1 轮 —— 只关 Baseband Guard，其余（KSU+SUSFS+KPM+NoMount）全开。
              # 嫌疑依据：BBG 有 runtime deny 逻辑 hook 设备访问（baseband_guard: deny ...），
              # 且 CONFIG_BBG_BLOCK_BOOT=y 直接在启动路径上；而内核里 'BBG'/'BLOCK_BOOT'
              # 字符串是 0 个（只有 baseband_guard 那套）→ 配置项名与实现不对应，本身可疑。
              #   no-bbg 能起 → 凶手就是 BBG，收工
              #   no-bbg 仍崩 → 排除 BBG，下一轮测 no-nomount / no-kpm
              echo "BASEBAND_GUARD_ENABLE=false"   >> "$GITHUB_ENV"
              echo "BASEBAND_GUARD_BOOT=false"     >> "$GITHUB_ENV"
              echo "[+] no-bbg：只关 Baseband Guard，其余组件照旧"
              ;;
            no-nomount)
              # ★ 二分第 2 轮：关 NoMount（VFS 层注入，早期挂载阶段出错就起不来）
              echo "NOMOUNT_ENABLE=false"          >> "$GITHUB_ENV"
              echo "[+] no-nomount：只关 NoMount"
              ;;
            no-kpm2)
              # ★ 二分第 3 轮：关 KPM（inline hook，与 SUSFS 有重叠）
              echo "KPM_INLINE=false"              >> "$GITHUB_ENV"
              echo "[+] no-kpm2：只关 KPM inline（sus_map 仍在）"
              ;;
            safe-defconfig)
              # 关键：**不能**改 DEFCONFIG_NAME。上游 composite action 里读的是
              # ${{ env.DEFCONFIG_NAME }}（workflow 级 env），GITHUB_ENV 覆盖不到它，
              # 改了反而让 make 去找一个不存在的 defconfig（实测 16 秒即失败）。
              # 正确做法：名字保持不变，由 ④-C 把 kona-perf_defconfig 复制成 kebab_defconfig。
              echo "SAFE_BUILD=1" >> "$GITHUB_ENV"
              echo "[+] safe-defconfig：用源码自带 kona-perf_defconfig 兜底（不改 defconfig 名）"
              ;;
            *)
              echo "[-] 未知 profile: $PROFILE"
              exit 1
              ;;
          esac
          echo "BUILD_PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "::endgroup::"

      # ── 原厂镜像：版本串 + defconfig 的唯一来源 ──
      - name: ④-C 取原厂 defconfig 与版本串（读自镜像，非人工抄写）
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          DEF="$GITHUB_WORKSPACE/device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          mkdir -p "$(dirname "$DEF")"
          # ★ 与 ③-P 保持同一来源：先 inputs，再 trigger.txt 的 profile=xxx，最后回落。
          PROFILE="${{ inputs.profile }}"
          if [ -z "$PROFILE" ] && [ -f "$GITHUB_WORKSPACE/trigger.txt" ]; then
            PROFILE=$(head -1 "$GITHUB_WORKSPACE/trigger.txt" | tr -d '\r' | sed -n 's/.*profile=\([a-z-]*\).*/\1/p')
          fi
          [ -z "$PROFILE" ] && PROFILE="safe-defconfig"
          echo "[+] ④-C 使用 profile = $PROFILE"

          # ══════════ 0-P) 版本串预注入（任何档位都生效）══════════
          # 背景：run 25 是 trigger.txt push 触发的，inputs.profile 为空 →
          # 落到 safe-defconfig 档 → 下面那个 `exit 0` 让整个 ④-C 不碰
          # stock_boot.img → 版本串走兜底 jenkins@rd-build-77 / Dec 21 2021。
          # 结果 /proc/version 三处与原厂不符（主机、日期、编译器）。
          #
          # 修法：把"读版本串"从档位判断里剥出来，放在最前面、与档位无关。
          # 两个来源，优先级从高到低：
          #   1. 仓库根的 uname.env —— 人工从目标手机自身 boot.img 解析后上传的
          #      8 行 KEY=VALUE（ikconfig.py <boot.img> --uname --env 的输出）。
          #      **这是唯一能保证与这台手机完全一致的来源。**
          #   2. 仓库根的 stock_boot.img —— 直接解析（96 MB，一般不传）。
          # 两者都没有，才让后面的档位逻辑走兜底并打警告。
          #
          # ★ CRLF 防御：uname.env 常常是在 Windows 上生成的（ikconfig.py --env）。
          #   一旦带 \r，值末尾会粘连 \\r，写进 Makefile / setlocalversion 后表现为
          #     "SUBLEVEL 无法解析" / "setlocalversion 输出 '-perf+" / "uname -r: 4"
          #   —— run 27 实测就是这么挂的（④-E 第 4 组 5 个 FAIL）。
          #   这里**无条件先规整成 LF**，不依赖上游怎么传。
          if [ -f "$GITHUB_WORKSPACE/uname.env" ]; then
            if grep -qU $'\r' "$GITHUB_WORKSPACE/uname.env" 2>/dev/null; then
              echo "[!] uname.env 含 CRLF，正在规整成 LF"
              sed -i 's/\r$//' "$GITHUB_WORKSPACE/uname.env"
            fi
          fi

          INJECTED=0
          if [ -s "$GITHUB_WORKSPACE/uname.env" ]; then
            echo "::group::[+] 版本串来自 uname.env（目标手机自身 boot.img 解析结果）"
            if grep -q '^STOCK_UNAME_RELEASE=' "$GITHUB_WORKSPACE/uname.env"; then
              cat "$GITHUB_WORKSPACE/uname.env" >> "$GITHUB_ENV"
              cat "$GITHUB_WORKSPACE/uname.env"
              echo "VERSION_SOURCE=stock-uname-env" >> "$GITHUB_ENV"
              INJECTED=1
              echo "[+] 已注入；来源标记 stock-uname-env（已证，与目标机一致）"
              # 自证：逐个 echo 关键值，肉眼就能看出有没有多余的空白/回车
              echo "  复核 >> STOCK_LOCALVERSION=[${STOCK_LOCALVERSION}]"
              echo "  复核 >> STOCK_SUBLEVEL=[${STOCK_SUBLEVEL}]"
              echo "  复核 >> STOCK_BUILD_HOST=[${STOCK_BUILD_HOST}]"
              echo "  复核 >> STOCK_COMPILER=[${STOCK_COMPILER}]"
            else
              echo "[!] uname.env 存在但没有 STOCK_UNAME_RELEASE 行，视为无效，继续往下找"
              head -5 "$GITHUB_WORKSPACE/uname.env" || true
            fi
            echo "::endgroup::"
          fi

          if [ "$INJECTED" = "0" ] && [ -f "$GITHUB_WORKSPACE/stock_boot.img" ]; then
            echo "::group::[+] 版本串来自仓库内 stock_boot.img"
            if python3 "$GITHUB_WORKSPACE/ikconfig.py" "$GITHUB_WORKSPACE/stock_boot.img" --uname --env > /tmp/repo_uname.env 2>/tmp/repo_uname.err; then
              cat /tmp/repo_uname.env
              cat /tmp/repo_uname.env >> "$GITHUB_ENV"
              echo "VERSION_SOURCE=stock-repo-boot" >> "$GITHUB_ENV"
              INJECTED=1
              echo "[+] 已注入；来源标记 stock-repo-boot（已证）"
            else
              cat /tmp/repo_uname.err || true
              echo "[!] 仓库内 stock_boot.img 解析失败，继续往下"
            fi
            echo "::endgroup::"
          fi

          if [ "$INJECTED" = "0" ]; then
            echo "::warning title=④-C 无版本串来源::既没有 uname.env 也没有 stock_boot.img，版本串将走兜底值（与原厂不符，/proc/version 会露出 clang 19）"
            echo "[!] 没有 uname.env / stock_boot.img → 版本串只能兜底"
            echo "[!] 正确做法见 docs/2026-11-15-完美内核-提取本机boot操作单.md"
          fi

          # 0) safe-defconfig 档：不依赖原厂 boot.img
          #    用途：在没有 stock_boot.img 时先把"编译链能不能过"验出来。
          #    代价：版本串未经镜像证实 —— 这一档的产物**不要刷机**。
          if [ "$PROFILE" = "safe-defconfig" ]; then
            echo "[+] profile=safe-defconfig：跳过 stock_boot.img 依赖"
            echo "    defconfig 用源码自带的 ${{ env.DEFCONFIG_NAME }}，版本串走默认值"
            if [ "$INJECTED" = "1" ]; then
              echo "    但版本串已由预注入提供（VERSION_SOURCE=${VERSION_SOURCE:-?}），不再是兜底值"
            else
              echo "    ⚠ 产物仅用于验证编译链，不要刷机（版本串未经镜像证实）"
            fi
            # 关键：只有没预注入时才写 fallback，否则会盖掉 uname.env 的已证来源
            if [ "$INJECTED" = "0" ]; then
              echo "VERSION_SOURCE=fallback" >> "$GITHUB_ENV"
            fi
            echo "SAFE_BUILD=1" >> "$GITHUB_ENV"
            KONA="$GITHUB_WORKSPACE/device_kernel/arch/arm64/configs/vendor/kona-perf_defconfig"
            # 优先用仓库根目录的 defconfig_stock.txt：它是从一加原厂 boot.img 的 IKCONFIG
            # 提取的真实配置（5000+ 行，2026-11-15 由 OOS 11.0.9.9 EU boot.img 提取，
            # 内核串实测 4.19.110-perf+，与目标完全一致）。只传 ~100 KB 文本，
            # 不需要把 96 MB 的 boot.img 塞进仓库。
            OV="$GITHUB_WORKSPACE/defconfig_stock.txt"
            OV_LINES=$( { wc -l < "$OV"; } 2>/dev/null || echo 0 )
            if [ "${OV_LINES:-0}" -gt 2000 ]; then
              cp "$OV" "$DEF"
              echo "[+] 用仓库内 defconfig_stock.txt（原厂 IKCONFIG，${OV_LINES} 行）覆盖 $DEF"
              # 只在没有预注入版本串时才把来源标成 stock-ikconfig，
              # 否则会把 uname.env 的已证来源盖掉
              if [ "$INJECTED" = "0" ]; then
                echo "VERSION_SOURCE=stock-ikconfig" >> "$GITHUB_ENV"
              fi
              echo "[+] defconfig 行数：$(wc -l < "$DEF")"
              exit 0
            fi
            # 判据不能只看"文件不存在"：上游 build-ready 的 "Set KSU and SUSFS for DEFCONFIG"
            # 会往一个还不存在的 defconfig 里 `>>` 追加 6 行（CONFIG_KSU=y / CONFIG_KSU_SUSFS=y 等），
            # 于是文件"存在但只有 6 行"，"不存在才复制"永远不成立。
            # run 4 实测：④-C 打印 行数=6 → ④-E 判 FAIL（defconfig 缺失或过短）。
            DEF_LINES=$( { wc -l < "$DEF"; } 2>/dev/null || echo 0 )
            if [ "${DEF_LINES:-0}" -lt 500 ]; then
              if [ -f "$KONA" ]; then
                # 上游 append 的 KSU/SUSFS 开关必须回填，否则内核不编 SukiSU → 刷了也没 root
                KEEP=$(grep -E '^CONFIG_(KSU|KSU_[A-Za-z0-9_]+)=' "$DEF" 2>/dev/null || true)
                echo "[!] $DEF 只有 ${DEF_LINES:-0} 行（上游 append 占位），用 kona-perf_defconfig 覆盖"
                cp "$KONA" "$DEF"
                if [ -n "$KEEP" ]; then
                  printf '%s\n' "$KEEP" >> "$DEF"
                  echo "[+] 已回填上游 KSU 开关：$(printf '%s' "$KEEP" | tr '\n' ' ')"
                fi
                for k in CONFIG_KSU=y CONFIG_KSU_SUSFS=y; do
                  grep -qx "$k" "$DEF" || echo "$k" >> "$DEF"
                done
                echo "[+] 已从 kona-perf_defconfig 复制出 $DEF（$(wc -l < "$DEF") 行）"
              else
                echo "[FATAL] 既没有可用 $DEF 也没有 $KONA，这一档跑不了"
                exit 1
              fi
            fi
            echo "[+] defconfig 行数：$(wc -l < "$DEF")"
            exit 0
          fi

          # 1) 拿 stock_boot.img（用于 defconfig；版本串已在 0-P 处理）
          HAVE_BOOT=0
          if [ -n "${{ env.BOOT_SOURCE }}" ]; then
            echo "[+] 下载 BOOT_SOURCE"
            curl -L --retry 3 --connect-timeout 20 -o stock_boot.img "${{ env.BOOT_SOURCE }}" && HAVE_BOOT=1
          elif [ -f "$GITHUB_WORKSPACE/stock_boot.img" ]; then
            echo "[+] 使用仓库内 stock_boot.img"
            HAVE_BOOT=1
          fi
          if [ "$HAVE_BOOT" = "1" ]; then
            ls -l stock_boot.img
            sha256sum stock_boot.img | tee boot_sha256.txt
          else
            echo "[!] 既没有 stock_boot.img，也没有 BOOT_SOURCE"
            echo "    它本来是版本串与 defconfig 的来源；版本串已由 0-P 处理，"
            echo "    现在只差 defconfig —— 若仓库根有 defconfig_stock.txt 就继续，否则停"
          fi

          # 2) 版本串：只有 0-P 没注入成功时才需要在这里补
          if [ "$INJECTED" = "0" ] && [ "$HAVE_BOOT" = "1" ]; then
            if python3 ikconfig.py stock_boot.img --uname --env > /tmp/uname.env 2>/tmp/uname.err; then
              cat /tmp/uname.env
              cat /tmp/uname.env >> "$GITHUB_ENV"
              echo "VERSION_SOURCE=stock" >> "$GITHUB_ENV"
              echo "[+] 版本串来源：原厂镜像（已证）"
              INJECTED=1
            else
              cat /tmp/uname.err || true
              echo "VERSION_SOURCE=fallback" >> "$GITHUB_ENV"
              echo "[!] 读不到版本串 → 回落默认 4.19.110-perf+ / jenkins@rd-build-90"
              echo "[!] 兜底值是 OOS 11.0.9.9 的原厂实测值，**不一定等于你手机**"
              echo "[!] 这条一旦回落，/proc/version 与原厂不符的概率显著上升。上机前必须 adb shell cat /proc/version 复核"
            fi
          fi

          # 3) defconfig：优先级 stock_boot.img > defconfig_stock.txt > 停
          if [ -s "$DEF" ] && [ "$(wc -l < "$DEF")" -gt 500 ]; then
            echo "[+] defconfig 已存在且 $(wc -l < "$DEF") 行，跳过提取"
          elif [ "$HAVE_BOOT" = "1" ]; then
            python3 ikconfig.py stock_boot.img -o "$DEF"
            echo "[+] 从 stock_boot.img 提取 defconfig"
          elif [ -f "$GITHUB_WORKSPACE/defconfig_stock.txt" ] && \
               [ "$(wc -l < "$GITHUB_WORKSPACE/defconfig_stock.txt")" -gt 500 ]; then
            cp "$GITHUB_WORKSPACE/defconfig_stock.txt" "$DEF"
            echo "[+] 没有 boot.img，用仓库内 defconfig_stock.txt（$(wc -l < "$DEF") 行）"
            echo "[!] 注意：这份可能不是你手机的原厂配置（OOS 而非 H2OS）"
          else
            echo "[-] 三条都没有：无 $DEF、无 stock_boot.img、无 defconfig_stock.txt"
            exit 1
          fi
          echo "[+] defconfig 行数：$(wc -l < "$DEF")"

      # ── 版本串落到 Makefile（值来自上一步）──
      - name: ④-A 版本串伪装
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/device_kernel"
          V="${STOCK_VERSION:-4}"
          P="${STOCK_PATCHLEVEL:-19}"
          S="${STOCK_SUBLEVEL:-110}"
          LOCALV="${STOCK_LOCALVERSION:--perf+}"
          U="${STOCK_BUILD_USER:-jenkins}"
          # 兜底值必须与原厂实测值一致（实测自 OOS 11.0.9.9 EU 的 boot.img）：
          #   jenkins@rd-build-90 / Mon Jul 12 10:08:43 CST 2021
          # 早先这两行兜底写的是 rd-build-77 / Dec 21 2021（那是 GitHub runner 的真实
          # 构建时间被误抄进兜底），一旦回落反而制造了一个"非原厂"特征。
          H="${STOCK_BUILD_HOST:-rd-build-90}"
          T="${STOCK_BUILD_TIMESTAMP:-Mon Jul 12 10:08:43 CST 2021}"

          echo "::group::[+] Version spoofing（来源：${VERSION_SOURCE:-fallback}）"
          echo "[+] 目标 uname -r: ${V}.${P}.${S}${LOCALV}"
          sed -i "s/^VERSION = .*/VERSION = ${V}/"                Makefile
          sed -i "s/^PATCHLEVEL = .*/PATCHLEVEL = ${P}/"          Makefile
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${S}/"              Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/'           Makefile

          # 用 printf 不用 heredoc：heredoc 在 YAML block scalar 里会破坏缩进
          if [ -f scripts/setlocalversion ]; then
            printf '#!/bin/sh\necho "%s"\n' "$LOCALV" > scripts/setlocalversion
            chmod +x scripts/setlocalversion
          fi

          echo "KBUILD_BUILD_USER=$U"          >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=$H"          >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1"        >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$T"     >> "$GITHUB_ENV"
          echo "KERNEL_RELEASE_TARGET=${V}.${P}.${S}${LOCALV}" >> "$GITHUB_ENV"

          head -5 Makefile
          echo "::endgroup::"

      # ── 编译器串伪装：/proc/version 唯一真来源 ──
      - name: ④-A2 伪造 /proc/version 的编译器串
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/device_kernel"

          # ══════════ 为什么这一步必须存在 ══════════
          # `cat /proc/version` 读的是 linux_banner，它在编译期由
          # include/generated/compile.h 的 LINUX_COMPILER 宏拼成，而这个宏来自
          # scripts/mkcompile_h 跑 `$CC -v` 抓到的编译器自述。
          #
          # 于是自编内核会把自己的构建环境原样印在 /proc/version 里：
          #   Linux version 4.19.110-perf+ (jenkins@rd-build-77)
          #   (clang version 19.1.7 (/home/runner/work/llvm-project/...)) #1 SMP ...
          # 而原厂是：
          #   Linux version 4.19.110-perf+ (jenkins@rd-build-90)
          #   (clang version 10.0.5 for Android NDK) #1 SMP PREEMPT Mon Jul 12 ...
          #
          # **SUSFS 的 SPOOF_UNAME 只 hook newuname 系统调用**（实测 susfs 补丁挂的是
          # SYSCALL_DEFINE1(newuname)），它管不到 /proc/version。任何 App 敲一次
          # `cat /proc/version` 就能看到 clang 19.1.7 —— 这是最廉价的 root 指纹。
          #
          # 修法：改 mkcompile_h，让 LINUX_COMPILER 可被 KBUILD_FAKE_COMPILER 覆盖，
          # 值取自原厂 boot.img（④-C 已解析成 STOCK_COMPILER）。
          # 这是纯字符串，不影响任何功能。
          CMP="${STOCK_COMPILER:-}"
          if [ -z "$CMP" ]; then
            # 兜底：原厂实测值。回落就等于没验过，必须打警告（同 ④-C 的口径）
            CMP="clang version 10.0.5 for Android NDK"
            echo "::warning title=④-A2 编译器串走兜底::没读到 STOCK_COMPILER，用了硬编码值。上机后必须 cat /proc/version 复核"
            echo "[!] STOCK_COMPILER 为空 → 兜底 '$CMP'（未经镜像证实）"
          else
            echo "[+] 编译器串来自原厂镜像：'$CMP'"
          fi

          python3 "$GITHUB_WORKSPACE/patch_mkcompile.py" . || {
            echo "[-] patch_mkcompile.py 失败 —— 这一步失败会导致 /proc/version 露出 clang 19"
            exit 1
          }

          # 值落进 GITHUB_ENV，供 ⑫ 编译时读取（mkcompile_h 是子 shell，继承 env）
          printf 'KBUILD_FAKE_COMPILER=%s\n' "$CMP" >> "$GITHUB_ENV"

          # 自证：打完补丁后确认分支真的进去了
          if grep -q 'KBUILD_FAKE_COMPILER' scripts/mkcompile_h; then
            echo "[+] scripts/mkcompile_h 已支持覆盖，第 $(grep -n 'KBUILD_FAKE_COMPILER' scripts/mkcompile_h | head -1 | cut -d: -f1) 行"
          else
            echo "[-] 补丁没生效：scripts/mkcompile_h 里没有 KBUILD_FAKE_COMPILER"
            exit 1
          fi

      # ── defconfig 关键项强制修正 ──
      - name: ④-B defconfig 关键项强制修正
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/device_kernel"
          DEF="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          LOCALV="${STOCK_LOCALVERSION:--perf+}"
          if [ ! -f "$DEF" ]; then
            echo "[FATAL] 找不到 $DEF"
            exit 1
          fi
          DEF="$DEF" LOCALV="$LOCALV" BUILD_PROFILE="${BUILD_PROFILE:-full}" python3 - <<'PYBLOCK'
          import os
          p = os.environ["DEF"]
          lv = os.environ["LOCALV"]
          # ★ 2026-11-16 修正：CONFIG_MODVERSIONS 从 drop 列表移除。
          # 原厂 /proc/config.gz 实测 CONFIG_MODVERSIONS=y，且手机所有 vendor .ko
          # （audio / wlan / display / touch）的 vermagic 都是
          #   4.19.110-perf+ SMP preempt mod_unload modversions aarch64
          # 而 run29 自编产物是 ... mod_unload aarch64（少了 modversions）
          # → 内核一启动，vendor 模块全部因 vermagic 不匹配被拒载 → 黑屏/重启 → 落 EDL。
          # 这就是「fastboot boot 必掉 EDL」的真正原因（不是镜像结构、不是 defconfig）。
          # 当初关掉它的理由是 run 20 的 ld.lld 报 R_AARCH64_ABS32 against '__crc_*'，
          # 但 run 23 起已换成交叉 GNU ld（见 ⑥-B），该错误前提不复存在。
          drop = ["CONFIG_MODULE_SIG", "CONFIG_MODULE_SIG_FORCE", "CONFIG_MODULE_SIG_ALL",
                  "CONFIG_MODULE_FORCE_LOAD", "CONFIG_LOCALVERSION",
                  "CONFIG_LOCALVERSION_AUTO", "CONFIG_KALLSYMS", "CONFIG_KALLSYMS_ALL",
                  "CONFIG_KPM", "CONFIG_IKCONFIG", "CONFIG_IKCONFIG_PROC",
                  "CONFIG_DEBUG_INFO"]
          lines = open(p, encoding='utf-8', errors='replace').read().splitlines()
          out = []
          for ln in lines:
              s = ln.strip()
              if any(s.startswith(k + '=') or s.startswith('# ' + k + ' is not set')
                     for k in drop):
                  continue
              out.append(ln)
          out.append('')
          out.append('# -- forced by build-kebab.yml v3 (version spoof + module compat + hiding) --')
          out.append('CONFIG_LOCALVERSION="%s"' % lv)
          out.append('# CONFIG_LOCALVERSION_AUTO is not set')
          out.append('CONFIG_KALLSYMS=y')
          out.append('CONFIG_KALLSYMS_ALL=y')
          # ★ 2026-11-16：minimal 档位不编 KSU/SUSFS/KPM，用于二分定位内核起不来的凶手。
          # 其它档位（full / no-kpm / safe-defconfig）行为不变。
          MINIMAL = os.environ.get("BUILD_PROFILE", "") == "minimal"
          if MINIMAL:
              out.append('# -- minimal profile: KSU / SUSFS / KPM 全部关闭 --')
              out.append('# CONFIG_KPM is not set')
              out.append('# CONFIG_KSU is not set')
              out.append('# CONFIG_KSU_SUSFS is not set')
          else:
              out.append('CONFIG_KPM=y')
              out.append('CONFIG_KSU=y')
              out.append('CONFIG_KSU_SUSFS=y')
          out.append('CONFIG_IKCONFIG=y')
          out.append('CONFIG_IKCONFIG_PROC=y')
          out.append('# disable module sig force, otherwise vendor .ko (lcd/touch/audio) rejected')
          out.append('# CONFIG_MODULE_SIG is not set')
          out.append('# CONFIG_MODULE_SIG_FORCE is not set')
          out.append('# CONFIG_MODULE_SIG_ALL is not set')
          out.append('CONFIG_MODULE_FORCE_LOAD=y')
          # ★ 2026-11-16：MODVERSIONS 必须开（原厂 =y），否则 vermagic 少 modversions
          # → 所有 vendor .ko 被拒载 → 起不来。原厂 /proc/config.gz 与原厂 .ko 的
          # vermagic 双向佐证，见 drop 列表上方的说明。
          # 配套：MODULE_FORCE_LOAD=y 保证即使个别模块 CRC 不匹配也仍可加载（原厂未开此项）。
          out.append('CONFIG_MODVERSIONS=y')
          out.append('# CONFIG_MODULE_REL_CRCS is not set')
          # 原厂 CONFIG_MODULES_USE_ELF_RELA=y（defconfig 已带，此处兜底确保不被冲掉）
          out.append('CONFIG_MODULES_USE_ELF_RELA=y')
          # ── 关掉 DEBUG_INFO（同时解决 DWARF 冲突与产物体积） ──
          # run 13 实测：编译跑到 security/selinux 才炸，报
          #   /tmp/netlink-xxxx.s:11: Error: junk at end of line, first unrecognized character is `"'
          #   /tmp/netlink-xxxx.s:11: Error: file number less than one
          # 这是 clang 生成的 DWARF5 `.file 0 "..."` 与 4.19 时代 GNU as 的老
          # `.file 1 "..."` 格式不兼容，引号被判成 junk。
          # 原厂 defconfig 里 CONFIG_DEBUG_INFO=y、DWARF4 未开（实测 4961-4964 行）。
          # 刷机用的是 Image，不需要调试信息；关掉它同时省时间（40→25 分钟）与体积。
          out.append('# CONFIG_DEBUG_INFO is not set')
          out.append('# CONFIG_DEBUG_INFO_REDUCED is not set')
          out.append('# CONFIG_DEBUG_INFO_DWARF4 is not set')
          out.append('# CONFIG_GDB_SCRIPTS is not set')
          open(p, 'w', encoding='utf-8', newline='\n').write('\n'.join(out) + '\n')
          print('[+] defconfig rewritten:', p, len(out), 'lines')
          PYBLOCK
          tail -20 "$DEF"

      # ── 开编前预检：不合格就在这里停，不浪费 40 分钟编译 ──
      - name: ④-E 开编前预检闸门
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          DEF="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          TARGET="${KERNEL_RELEASE_TARGET:-4.19.110-perf+}"
          FAIL=0
          p() { echo "  PASS  $1"; }
          f() { echo "  FAIL  $1"; FAIL=1; }

          echo "=== 1. defconfig 文件 ==="
          if [ -s "$DEF" ] && [ "$(wc -l < "$DEF")" -gt 500 ]; then
            p "defconfig 存在且 $(wc -l < "$DEF") 行"
          else
            f "defconfig 缺失或过短：$DEF"
          fi

          echo "=== 2. 必需配置项 ==="
          # ★ CONFIG_MODVERSIONS 必须在列：原厂 =y，vendor .ko 的 vermagic 带 modversions。
          # 少了它 → 所有 vendor 驱动被拒载 → 内核起不来 → 掉 EDL（run29 的真死因）。
          # ★ minimal 档位例外：KSU/KPM 是故意关掉的（二分定位用），但 MODVERSIONS /
          #   MODULES_USE_ELF_RELA / FORCE_LOAD 一条都不能少。
          if [ "${BUILD_PROFILE:-full}" = "minimal" ]; then
            for k in CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_MODULE_FORCE_LOAD CONFIG_MODVERSIONS CONFIG_MODULES_USE_ELF_RELA; do
              grep -qx "$k=y" "$DEF" && p "$k=y" || f "$k 未开"
            done
            for k in CONFIG_KSU CONFIG_KPM CONFIG_KSU_SUSFS; do
              if grep -qx "$k=y" "$DEF"; then f "$k 在 minimal 档不该为 y"; else p "$k 已关（minimal 预期）"; fi
            done
          else
            for k in CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_KPM CONFIG_MODULE_FORCE_LOAD CONFIG_KSU CONFIG_MODVERSIONS CONFIG_MODULES_USE_ELF_RELA; do
              grep -qx "$k=y" "$DEF" && p "$k=y" || f "$k 未开"
            done
          fi

          echo "=== 3. 必须关掉的项（否则 vendor 模块拒载 → 黑屏）==="
          for k in CONFIG_MODULE_SIG CONFIG_MODULE_SIG_FORCE CONFIG_MODULE_SIG_ALL CONFIG_LOCALVERSION_AUTO; do
            if grep -qx "$k=y" "$DEF"; then f "$k 仍为 y"; else p "$k 未开"; fi
          done

          echo "=== 3b. vermagic 目标串（供应商模块兼容的硬要求）==="
          # 手机端实测：原厂 .ko 的 vermagic = 4.19.110-perf+ SMP preempt mod_unload modversions aarch64
          # 内核侧必须同时具备 SMP / PREEMPT / MODULE_UNLOAD / MODVERSIONS 才能拼出同一串。
          VM_OK=1
          for k in CONFIG_SMP CONFIG_PREEMPT CONFIG_MODULE_UNLOAD; do
            grep -qx "$k=y" "$DEF" && p "$k=y（vermagic 组成项）" || { f "$k 未开（vermagic 会与 vendor 模块不符）"; VM_OK=0; }
          done
          if [ "$VM_OK" = "1" ]; then
            p "vermagic 四要素齐备，预期产出：4.19.110-perf+ SMP preempt mod_unload modversions aarch64"
          fi

          echo "=== 4. 版本串 ==="
          # 先查 CRLF 污染：run 27 实测就是 uname.env 带 \r 导致
          # SUBLEVEL 解析失败 / setlocalversion 输出 '-perf+ / uname -r: 4
          CRHIT=0
          for f in Makefile scripts/setlocalversion "$DEF"; do
            if [ -f "$f" ] && grep -qU $'\r' "$f" 2>/dev/null; then
              CRHIT=1
              f "文件含 CRLF：$f（来自 uname.env 的 \\r 污染）"
            fi
          done
          [ "$CRHIT" = "0" ] && p "Makefile / setlocalversion / defconfig 均无 CRLF"

          grep -q "CONFIG_LOCALVERSION=\"-perf+\"" "$DEF" && p "LOCALVERSION=-perf+" || f "LOCALVERSION 不是 -perf+"
          grep -q "^VERSION = 4$"     Makefile && p "Makefile VERSION=4"     || f "Makefile VERSION 不对"
          grep -q "^PATCHLEVEL = 19$" Makefile && p "Makefile PATCHLEVEL=19" || f "Makefile PATCHLEVEL 不对"
          if grep -qE "^SUBLEVEL = [0-9]+$" Makefile; then
            p "Makefile SUBLEVEL=$(grep -E '^SUBLEVEL = ' Makefile | tr -dc '0-9')"
          else
            f "Makefile SUBLEVEL 无法解析 —— 明细：$(grep -E '^SUBLEVEL' Makefile | cat -A | head -1)"
          fi
          SL=$(bash scripts/setlocalversion 2>/dev/null | tr -d '\r' || true)
          [ "$SL" = "-perf+" ] && p "setlocalversion 输出 -perf+" \
            || f "setlocalversion 输出 '$SL'（应为 -perf+；若尾部有多余字符查 CRLF）"

          echo "=== 5. SUSFS 补丁 ==="
          # 注意：② build-env 里有 `mv $GITHUB_WORKSPACE/Patches /tmp/`，
          # 所以 ④-E 这个时点补丁已经在 /tmp/Patches 下（上游 ⑤ 也是从那儿取）。
          PATCH_A="/tmp/Patches/Patch/susfs_patch_to_4.19.patch"
          PATCH_B="$GITHUB_WORKSPACE/Patches/Patch/susfs_patch_to_4.19.patch"
          if [ -f "$PATCH_A" ]; then
            p "SUSFS 4.19 补丁就位（/tmp/Patches）"
          elif [ -f "$PATCH_B" ]; then
            p "SUSFS 4.19 补丁就位（工作区）"
          else
            f "找不到 SUSFS 4.19 补丁（已查 $PATCH_A 与 $PATCH_B）"
          fi

          echo "=== 6. 容量预算 ==="
          echo "  INFO  boot 分区 ${{ env.BOOT_PARTITION_BYTES }} B，Image 预算 ${{ env.BOOT_IMAGE_BUDGET }} B"

          # ══════════ 7. 编译器串伪装前置检查 ══════════
          # ④-A2 已经改过 scripts/mkcompile_h 并注入 KBUILD_FAKE_COMPILER。
          # 这里在开编前确认两件事，避免白跑 45 分钟才发现 /proc/version 会露馅。
          echo "=== 7. 编译器串伪装（/proc/version 的唯一真来源）==="
          MK="scripts/mkcompile_h"
          if [ -f "$MK" ] && grep -q 'KBUILD_FAKE_COMPILER' "$MK"; then
            p "scripts/mkcompile_h 已支持 KBUILD_FAKE_COMPILER 覆盖"
          else
            f "scripts/mkcompile_h 未打补丁 —— /proc/version 会露出真实 clang 版本"
          fi
          if [ -n "$KBUILD_FAKE_COMPILER" ]; then
            p "KBUILD_FAKE_COMPILER 已注入：'$KBUILD_FAKE_COMPILER'"
            case "$KBUILD_FAKE_COMPILER" in
              *19.*|*runner*|*llvm-project*)
                f "注入的编译器串看起来是自编环境（$KBUILD_FAKE_COMPILER）"
                ;;
              *) p "注入值不含 19.x / runner / llvm-project 特征" ;;
            esac
          else
            f "KBUILD_FAKE_COMPILER 为空 —— /proc/version 会用真实 \$CC -v"
          fi

          # ══════════ 8. 版本串来源可信度（不阻塞，但要醒目）══════════
          echo "=== 8. 版本串来源 ==="
          echo "  INFO  VERSION_SOURCE=${VERSION_SOURCE:-<unset>}"
          case "${VERSION_SOURCE:-}" in
            stock-uname-env)
              p "来源=uname.env（目标手机自身 boot.img 解析，最可信）"
              ;;
            stock|stock-repo-boot)
              p "来源=仓库 stock_boot.img（原厂镜像，但可能不是这台手机）"
              ;;
            stock-ikconfig)
              echo "  WARN  来源=defconfig_stock.txt（只有 config，版本串可能是兜底值）"
              ;;
            fallback|"")
              echo "  WARN  来源=兜底值 —— /proc/version 未必与原厂一致，别拿它当完美版"
              ;;
            *)
              echo "  WARN  未知来源 '${VERSION_SOURCE}'"
              ;;
          esac

          echo "=== 目标 uname -r: $TARGET ==="
          if [ "$FAIL" = "0" ]; then
            echo "[+] 预检全过，允许编译"
          else
            echo "[-] 预检未过，已停在编译之前"
            echo "::error title=④-E 预检失败::上面日志里所有 FAIL 行就是失败项"
            exit 1
          fi

      - name: ⑤ 打 SUSFS 补丁（v2.2.00，4.19 专用）
        if: env.BUILD_PROFILE != 'minimal'
        uses: ./.github/workflows/patch-susfs

      # ── .rej 不再静默：落盘成可读摘要 ──
      - name: ⑤-R SUSFS 拒块摘要（不中断构建）
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel" || exit 0
          OUT="$GITHUB_WORKSPACE/rej-summary.txt"
          N=$(find . -name '*.rej' 2>/dev/null | wc -l)
          {
            echo "rej files: $N"
            echo "generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
          } > "$OUT"
          if [ "$N" -gt 0 ]; then
            find . -name '*.rej' | sort | tee -a "$OUT"
            for r in $(find . -name '*.rej' | sort); do
              echo "" >> "$OUT"
              echo "===== $r =====" >> "$OUT"
              head -40 "$r" >> "$OUT"
            done
            echo "[!] 有 $N 个拒块，内容见 rej-summary.txt（这不必然导致失败，但要人看一眼）"
          else
            echo "[+] 无拒块"
          fi
          cat "$OUT"

      - name: ⑥ 去掉 kprobe（4.19 厂商内核必须）
        uses: ./.github/workflows/patch-no-kprobe

      # ── 老内核 × 新工具链：GCC 10+ 默认 -fno-common，4.19 的 dtc 会因此链接失败 ──
      - name: ⑥-B 老内核兼容修正（yylloc 重复定义 / -fcommon）
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "=== dtc-lexer.l 里的 yylloc ==="
          grep -n 'yylloc' scripts/dtc/dtc-lexer.l | head -5 || true
          # 上游 Linux 5.4 的修法：lexer 不再自己定义 yylloc（parser.tab.c 会生成一份）
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l
          sed -i 's/^static YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l
          grep -n 'yylloc;' scripts/dtc/dtc-lexer.l | head -3 || true
          # 兜底：host 工具加 -fcommon（老内核多处依赖 common 符号）
          if ! grep -q 'fcommon' scripts/dtc/Makefile; then
            sed -i 's|^HOSTCFLAGS_dtc-lexer\.lex\.o := -I\$(src)$|HOSTCFLAGS_dtc-lexer.lex.o := -I$(src) -fcommon|' scripts/dtc/Makefile
            sed -i 's|^HOSTCFLAGS_dtc-parser\.tab\.o := -I\$(src)$|HOSTCFLAGS_dtc-parser.tab.o := -I$(src) -fcommon|' scripts/dtc/Makefile
          fi
          echo "=== dtc/Makefile 里的 HOSTCFLAGS ==="
          grep -n 'HOSTCFLAGS_dtc' scripts/dtc/Makefile || true

          # 4.19 的 arch/arm64/Makefile 会给 AS / LDFLAGS 塞 -EL（小端历史写法）。
          # 现代 aarch64 as 不认 -EL，clang 会把它当 mips 选项转发给 /usr/bin/as：
          #   /usr/bin/as: unrecognized option '-EL' → assembler command failed → scripts/mod/empty.o 失败
          if grep -qE '^AS[[:space:]]*\+=[[:space:]]*-EL$' arch/arm64/Makefile; then
            sed -i -E 's/^AS[[:space:]]*\+=[[:space:]]*-EL$/AS +=/' arch/arm64/Makefile
          fi
          if grep -qE '^KBUILD_LDFLAGS[[:space:]]*\+=[[:space:]]*-EL[[:space:]]' arch/arm64/Makefile; then
            sed -i -E 's/^KBUILD_LDFLAGS[[:space:]]*\+=[[:space:]]*-EL[[:space:]]/KBUILD_LDFLAGS += /' arch/arm64/Makefile
          fi
          echo "=== arch/arm64/Makefile 里残留的 -EL ==="
          grep -n -- '-EL' arch/arm64/Makefile || echo "  （已清空）"

          # -EL 可能不止在 arch/arm64/Makefile（厂商副本/其它 Makefile 也会塞）。
          # arm64 默认小端，-EL 纯冗余，清掉无副作用；把改过的文件打出来作证据。
          HIT=$(grep -rln -- '-EL' --include='Makefile' --include='Kbuild' --include='*.mk' . 2>/dev/null | grep -v '^\./out/' || true)
          if [ -n "$HIT" ]; then
            echo "=== 其它含 -EL 的构建文件（将被清理） ==="
            echo "$HIT"
            for f in $HIT; do
              sed -i -E 's/(^|[[:space:]])-EL([[:space:]]|$)/\1\2/g' "$f"
            done
          else
            echo "=== 其它构建文件里没有 -EL ==="
          fi

          # ── 工具链修正：4.19 必须用外部交叉 as，但要把路径指对 ──
          # 结论演进（四轮实测）：
          #   run 7/8 清 -EL → 无效，因为 -EL 是 arch/arm64 正常的 32 位小端标志，
          #             https://…/arch/arm64/Makefile 就在小端分支写 AS += -EL
          #   run 9   改用 LLVM 集成汇编器（去 -no-integrated-as）→ 进了真编译但 vdso 炸：
          #             gettimeofday.S: too many positional arguments
          #             note.S: changed section flags for .note.Linux
          #             这是 4.19 老 GNU 汇编宏 vs 新 LLVM IAS 的已知不兼容
          # 真因：顶层 Makefile
          #   GCC_TOOLCHAIN_DIR := $(dir $(shell which $(CROSS_COMPILE)elfedit))
          #   CLANG_FLAGS += --prefix=$(GCC_TOOLCHAIN_DIR)
          # runner 上没有 <triple>elfedit → 该目录为空 → --prefix 为空 →
          # clang 调裸 as → /usr/bin/as（x86 汇编器）→ 把 -EL 当 MIPS 选项报错。
          # 修法：造一个 shim 目录，把交叉工具链的 as/ld/... 按 clang 期望的名字
          #      （<CLANG_TRIPLE 去尾横线>-as，即 aarch64-linux-gnu-as）链进去，
          #      --prefix 指向它。--prefix 必须保留，-no-integrated-as 也必须保留。
          # ⚠ 关键：clang 的 --prefix 是**字符串前缀拼接**，clang 实际执行的是
          #      <prefix>as        （不是 <prefix><triple>-as）
          # 所以 shim 里必须有**裸 as**。但裸 as 绝不能进 PATH —— 否则宿主编译
          # （HOSTCC 编 scripts/basic/fixdep，x86_64）也会用 aarch64 的 as，
          # 报 `as: unrecognized option '--64'`（run 10 实测）。
          # 结论：裸名 + 带 triple 名都放，但**不 export PATH、不写 GITHUB_PATH**。
          # run 11 的教训：只放带 triple 名 → clang 找不到 <prefix>as → 回落到
          # /usr/bin/as → 又报 -EL。
          SHIM="$GITHUB_WORKSPACE/crossshim"
          rm -rf "$SHIM"
          mkdir -p "$SHIM"
          SHIM_N=0
          for t in as ld ar nm strip objcopy objdump elfedit; do
            src=$(ls "$GITHUB_WORKSPACE"/gcc-64/bin/*-"$t" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              ln -sf "$src" "$SHIM/$t" 2>/dev/null || cp "$src" "$SHIM/$t"
              ln -sf "$src" "$SHIM/aarch64-linux-gnu-$t" 2>/dev/null || cp "$src" "$SHIM/aarch64-linux-gnu-$t"
              SHIM_N=$((SHIM_N+1))
            fi
          done
          echo "=== 交叉 shim（$SHIM_N 项，裸名+triple 双套；不进 PATH） ==="
          ls "$SHIM" 2>/dev/null | head -20
          if [ -e "$SHIM/as" ]; then
            echo "[+] shim/as -> $(readlink -f "$SHIM/as" 2>/dev/null || echo ok)"
            printf 'nop\n' > /tmp/_probe.s
            if "$SHIM/as" -EL -o /tmp/_probe.o /tmp/_probe.s 2>/dev/null; then
              echo "  PASS shim/as 接受 -EL（真交叉汇编器）"
            else
              echo "  WARN shim/as 不接受 -EL"
            fi
          else
            echo "[FATAL] shim/as 缺失（gcc-64/bin 里没有 *-as）"
          fi
          # 必须确认 PATH 里没有 shim（run 10 的坑）
          case ":$PATH:" in
            *":$SHIM:"*) echo "[!] shim 在 PATH 里了，移除"; PATH=$(echo "$PATH" | tr ':' '\n' | grep -vx "$SHIM" | paste -sd: -); export PATH ;;
            *) echo "[+] PATH 中没有 shim（宿主 x86 编译安全）" ;;
          esac

          # ── 连接器检查：本轮从 ld.lld 换回交叉 GNU ld ──
          # run 22 实测 ld.lld 对 4.19 老代码报
          #   relocation R_AARCH64_LDST32_ABS_LO12_NC ... not aligned to 4 bytes
          # （fs/open.o do_faccessat、fs/stat.o vfs_statx、fs/exec.o __do_execve_file）
          # 这是 LLD 的严格对齐检查；GNU ld 会对这类地址做宽容处理，与 4.19 写法兼容。
          echo "=== 连接器 ==="
          # 注意：本步骤开头有 set -e，循环体最后一条命令返回非 0 会让整个脚本退出
          # （run 23 实测：gcc-32/bin 不存在 → [ -d ] 返回 1 → ⑥-B 直接失败）。
          # 所以这里每个条件判断都必须用 if，且末尾统一 || true。
          for d in "$GITHUB_WORKSPACE/gcc-64/bin" "$GITHUB_WORKSPACE/gcc-32/bin"; do
            if [ -d "$d" ]; then
              ls "$d" 2>/dev/null | grep -E -- '-ld$' | head -2 | sed "s|^|  $(basename "$(dirname "$d")")/bin: |" || true
            else
              echo "  $d: 不存在"
            fi
          done || true
          if [ -x "$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android-ld" ]; then
            echo "  PASS 交叉 GNU ld 存在"
            "$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android-ld" --version 2>/dev/null | head -1 | sed 's/^/  /' || true
          else
            echo "  WARN 没找到 aarch64-linux-android-ld（LD 会回落到 $(CROSS_COMPILE)ld）"
          fi
          [ -f Makefile.bak.el ] || cp Makefile Makefile.bak.el
          if grep -q -- '--prefix=$(GCC_TOOLCHAIN_DIR)' Makefile; then
            sed -i "s|--prefix=\$(GCC_TOOLCHAIN_DIR)|--prefix=$SHIM/|" Makefile
            echo "[+] --prefix 已指向 shim"
          fi
          echo "=== 确认：--prefix / -no-integrated-as ==="
          grep -n -- '--prefix=' Makefile | head -3
          grep -n -- '-no-integrated-as' Makefile | head -3

          # ══════════ 修复 SUSFS 补丁被拒的 include（run 15 根因）══════════
          # run 15 实测：⑤ 打 SUSFS 补丁时 fs/namei.c 的 include 段被拒（.rej），
          # 因为一加原厂在 include 块里多插了 #ifdef CONFIG_FSC，patch 上下文对不上。
          # 结果 fs/namei.c 里没有 <linux/susfs_def.h>，于是
          #   ND_STATE_LOOKUP_LAST / ND_STATE_OPEN_LAST / SUSFS_IS_INODE_OPEN_REDIRECT* 全部未定义
          # → 编译报 "use of undeclared identifier" / "implicit declaration"。
          # 这不是编译器问题，是补丁没打全，必须手工补上。
          if [ -f fs/namei.c ]; then
            if ! grep -q 'susfs_def.h' fs/namei.c; then
              echo "[!] fs/namei.c 缺 susfs_def.h include，补上"
              # 插在 "internal.h" 之前（补丁原本的位置），用 awk 保证插一次
              awk 'BEGIN{done=0}
                   /^#include "internal.h"$/ && !done {
                     print "#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)";
                     print "#include <linux/susfs_def.h>";
                     print "#endif";
                     print "";
                     done=1
                   }
                   {print}' fs/namei.c > fs/namei.c.new && mv fs/namei.c.new fs/namei.c
              grep -n 'susfs_def.h' fs/namei.c | head -2
            else
              echo "[+] fs/namei.c 已有 susfs_def.h include"
            fi
          fi

          # ══════════ fdinfo.c 拒块补偿（run 26 诊断材料实测暴露）══════════
          # SUSFS 补丁给 fs/notify/fdinfo.c 准备了三个 hunk，在一加 SM8250 源码上
          # **全部被拒**（.rej 实测 2 个）。旧版本只插了个 include，功能体从未补上，
          # 注释还写着"非致命"——这是错的：
          #
          #   /proc/<pid>/fdinfo/<fd> 里 inotify 每行打印 "inotify wd:%x ino:%lx sdev:%x ..."
          #   其中 ino/sdev 是 **inode 号和块设备号**。检测方可以：
          #     a = stat("/data/local/tmp/fsvc")   → 已被 SUS_KSTAT 伪造成 AAA
          #     b = 读持有该 fd 的进程的 fdinfo     → 真实 ino BBB
          #   两边不一致 = 直接证明文件被动过。SUSFS 的
          #   susfs_sus_kstat_spoof_inotify_fdinfo() 就是为让 b 也变成 AAA 而存在。
          #
          # 实现放在 code/patch_fdinfo.py（可自测、可 --check / --revert），
          # 这里只调用。细节与判死理由见该文件头注释。
          if [ -f fs/notify/fdinfo.c ]; then
            python3 "$GITHUB_WORKSPACE/patch_fdinfo.py" . || {
              echo "[!] patch_fdinfo.py 失败（不致命，继续编）"
            }
            echo "=== fdinfo.c 现状 ==="
            python3 "$GITHUB_WORKSPACE/patch_fdinfo.py" . --check || true
            grep -c 'susfs' fs/notify/fdinfo.c || true
          fi

          # ══════════ KSU 4.19 ABI 兼容（run 16/17 实测演进）══════════
          # run 16: kpm.c:182  access_ok(addr, size) 两参 → 4.19 是三参，报
          #         "too few arguments provided to function-like macro invocation"
          # run 17: 我给 strncpy_from_user_nofault 写了 void* 的桩 → 撞上上游
          #         kernel_compat.h:99 自带的 char* 版本，报 conflicting types。
          #         实测上游已自备完整实现（含 ksu_access_ok 回退），不需要我补。
          # 结论：上游 kernel_compat.h 已自备 ksu_access_ok(addr,size) 宏
          #       （第 52-55 行：<5.0 走两参，>=5.0 走 VERIFY_READ 三参），
          #       ksu_strncpy_from_user_nofault 也有完整实现（char* 版）。
          #       所以正确做法是让 kpm.c 走**上游的宏**，而不是我硬写三参
          #       （硬写会在 >=5.0 的内核上重复加参数）。
          KPM_C="drivers/kernelsu/extension/kpm/kpm.c"
          if [ -f "$KPM_C" ]; then
            # 先把我上一轮可能写进去的 VERIFY_WRITE 三参还原成上游宏
            if grep -q 'access_ok(VERIFY_WRITE, u64_to_user_ptr' "$KPM_C"; then
              sed -i -E 's/access_ok\(VERIFY_WRITE, (u64_to_user_ptr\([^)]*\)), /ksu_access_ok(\1, /g' "$KPM_C"
              echo "[+] 已把 VERIFY_WRITE 三参改回上游 ksu_access_ok 宏"
            fi
            # 两参 access_ok 也换上游宏
            if grep -q '[^_]access_ok(u64_to_user_ptr' "$KPM_C"; then
              sed -i -E 's/(^|[^_[:alnum:]])access_ok\((u64_to_user_ptr\([^)]*\)), /\1ksu_access_ok(\2, /g' "$KPM_C"
              echo "[+] 已把两参 access_ok 换成 ksu_access_ok"
            fi
            echo "=== kpm.c 里的 access_ok 调用 ==="
            grep -n 'access_ok' "$KPM_C" | head -4
          fi

          # 4.19 的顶层 Makefile 把 -Wno-unused-but-set-variable 只写在 GCC 分支（else，764 行），
          # clang 分支（if cc-name==clang）根本没有它 → 新版 clang 直接把这类风格警告当错误
          # （run 19 实测 drivers/vservices/session.c:1907 死在 -Wunused-but-set-variable）。
          # 厂商驱动里"设了没用/定义了没引用"的写法极多，刷机不追求零警告。
          # 先逐个关具体告警，再补一条 -Wno-error 兜底（防止将来换个 clang 版本又冒新警告）。
          for w in unused-but-set-variable unused-variable unused-const-variable \
                   unused-value unused-function unused-label address-of-packed-member \
                   misleading-indentation bool-operation; do
            if ! grep -q "Wno-$w" Makefile; then
              printf 'KBUILD_CFLAGS += -Wno-%s\n' "$w" >> Makefile
            fi
          done
          # 兜底：把"所有警告降级为提示"。放在文件末尾 → 后出现者生效，
          # 覆盖前面 line 425 的 -Wall 与任何 -Werror= 细则。
          # 注意：-Werror=implicit-function-declaration 这类"真 bug"仍可能生效，
          # 那是我们想保留的（隐式声明通常意味着真缺头文件）。
          if ! grep -qx 'KBUILD_CFLAGS += -Wno-error' Makefile; then
            printf '\n# [build-kebab] 厂商老驱动不追求零警告，全局降级\nKBUILD_CFLAGS += -Wno-error\n' >> Makefile
          fi
          echo "=== 已追加的 -Wno-* / -Wno-error ==="
          grep -c 'Wno-' Makefile
          tail -3 Makefile

          # ══════════ vmlinux 链接期两处修复（run 20 根因）══════════
          # run 20 已编译完全部源码（5509 行日志，AR built-in.a + MODPOST 都过了），
          # 死在最后链接 vmlinux 的两条：
          #
          # ① ld.lld: error: undefined symbol: stpcpy
          #    referenced by tty_io.c(show_cons_active) / apparmor lsm.c(param_get_*)
          #    → 新版 clang 优化器把 strcpy 改写成 stpcpy（LLVM 已知行为），
          #      而 4.19 的 lib/string.c 没有 stpcpy（5.x 才加）。
          #    修法：补实现 + 传 -fno-builtin-stpcpy 双保险。
          #
          # ② ld.lld: error: relocation R_AARCH64_ABS32 cannot be used against
          #    symbol '__crc_gsi_write_channel_scratch'; recompile with -fPIC
          #    → CONFIG_MODVERSIONS 生成的 __kcrctab 段在 LLD 下要 -fPIC。
          #
          #    ★ 2026-11-16 修正结论：当初的处理是「关掉 MODVERSIONS」—— 那是错的。
          #      关掉后 vermagic 少 modversions，原厂 vendor .ko（audio/wlan/display/touch）
          #      全部因 vermagic 不匹配被拒载 → 内核起不来 → 落 EDL（这就是 run29 的真死因）。
          #      正确修法有两条，本项目两条都上：
          #        a) 换链接器：run 23 起已从 ld.lld 换成交叉 GNU ld（⑥-B），
          #           GNU ld 对 __kcrctab 的 ABS32 重定位是宽容的，不再需要 -fPIC。
          #        b) 保留 MODVERSIONS=y，同时开 MODULE_FORCE_LOAD=y —— 即使个别模块
          #           CRC 对不上也仍允许加载（原厂未开此项，我们额外加保险）。
          #      若日后又切回 LLD 并重新报此错，不要动 MODVERSIONS，改为给 __kcrctab 段
          #      单独加 -fPIC（scripts/Makefile.build 里对 kernel/module.o 等）。
          if [ -f lib/Makefile ] && ! grep -q 'ksu_compat_string' lib/Makefile; then
            printf '%s\n' \
              '/* stpcpy: 4.19 没有；新版 clang 会把 strcpy 优化成本函数调用 */' \
              '#include <linux/string.h>' \
              '#include <linux/export.h>' \
              '#ifndef __HAVE_ARCH_STPCPY' \
              'char *stpcpy(char *dest, const char *src)' \
              '{' \
              '    while ((*dest++ = *src++) != 0)' \
              '        ;' \
              '    return dest - 1;' \
              '}' \
              'EXPORT_SYMBOL(stpcpy);' \
              '#endif' > lib/ksu_compat_string.c
            sed -i 's/^lib-y := ctype\.o string\.o/lib-y := ctype.o string.o ksu_compat_string.o/' lib/Makefile
            echo "[+] 已加 lib/ksu_compat_string.c（stpcpy 实现）"
            grep -n 'lib-y := ' lib/Makefile | head -1
          fi
          if ! grep -q 'fno-builtin-stpcpy' Makefile; then
            printf 'KBUILD_CFLAGS += -fno-builtin-stpcpy\n' >> Makefile
            echo "[+] 已加 -fno-builtin-stpcpy"
          fi

          # ══════════ 修 ksu_su_compat_enabled 的对齐（run 22/24 真根因）══════════
          # 两轮实测、两个链接器报的是同一个符号，说明这不是链接器问题：
          #   run 22  ld.lld : improper alignment for relocation R_AARCH64_LDST32_ABS_LO12_NC
          #   run 24  GNU ld : relocation truncated to fit: R_AARCH64_LDST32_ABS_LO12_NC
          #                    against symbol 'ksu_su_compat_enabled'
          #                    defined in .data..read_mostly section
          # 触发点：fs/open.c(.text+0xbfc)、fs/stat.c、fs/exec.c
          #
          # 真因：上游 kernel/feature/sucompat.c 第 4 行
          #     bool ksu_su_compat_enabled __read_mostly = true;
          # bool 只有 1 字节，放进 .data..read_mostly 段后不保证 4 字节对齐；
          # 而 fs/*.c 里生成的是 LDR W（32 位加载，要求地址 4 字节对齐），
          # 落点不是 4 的倍数时两种链接器都会拒绝。给变量加 __aligned(4) 即解。
          SUC="drivers/kernelsu/feature/sucompat.c"
          SUH="drivers/kernelsu/feature/sucompat.h"
          if [ -f "$SUC" ] && ! grep -q 'ksu_su_compat_enabled.*__aligned' "$SUC"; then
            # 用 awk 拼行，避免 sed 的  反向引用在 YAML/heredoc 里被转义吃掉
            awk '{ if ($1=="bool" && $2=="ksu_su_compat_enabled" && $3=="__read_mostly" && !done) { print "bool ksu_su_compat_enabled __read_mostly __aligned(4) = true;"; done=1 } else print }' "$SUC" > "$SUC.new" && mv "$SUC.new" "$SUC"
            echo "[+] sucompat.c 已加 __aligned(4)"
            grep -n 'ksu_su_compat_enabled' "$SUC" | head -2
          fi
          if [ -f "$SUH" ] && ! grep -q 'ksu_su_compat_enabled.*__aligned' "$SUH"; then
            sed -i -E 's/^extern[[:space:]]+bool[[:space:]]+ksu_su_compat_enabled;$/extern bool ksu_su_compat_enabled __aligned(4);/' "$SUH"
            echo "[+] sucompat.h 已加对齐声明"
            grep -n 'ksu_su_compat_enabled' "$SUH" | head -2
          fi

          # 实测上游 event.c：第 81、258 行都写 ksu_strncpy_from_user_nofault(...)，
          # 只有第 143 行写成裸 strncpy_from_user_nofault(...) —— 上游笔误。
          # 4.19 没有裸版函数，于是 implicit declaration → 编译失败。
          # (run 17 我用宏定义裸名去补，反而与上游 char* 版撞成 conflicting types；
          #  这次只改这一处调用，不动任何定义。)
          EVT="drivers/kernelsu/sulog/event.c"
          if [ -f "$EVT" ]; then
            N=$(grep -c '[^_[:alnum:]]strncpy_from_user_nofault(' "$EVT" 2>/dev/null || echo 0)
            if [ "$N" -gt 0 ]; then
              sed -i -E 's/(^|[^_[:alnum:]])strncpy_from_user_nofault\(/\1ksu_strncpy_from_user_nofault(/g' "$EVT"
              echo "[+] event.c 补上 ksu_ 前缀（$N 处）"
            fi
            echo "=== event.c 里的 nofault 调用 ==="
            grep -n 'nofault' "$EVT" | head -5
          fi
          # SukiSU 的 kernel_includes.h 无条件 #include <linux/static_call.h>，
          # 而该头是 5.10 才引入的（4.19 实测 404）。KSU 代码里并不真正调用
          # static_call，只是头文件传递依赖，所以给一个空桩即可。
          if [ ! -f include/linux/static_call.h ]; then
            echo "[!] 4.19 没有 include/linux/static_call.h，生成空桩"
            # 用 printf 不用 heredoc：heredoc 在 YAML block scalar 里会破坏缩进
            printf '%s\n' \
              '/* stub for kernels < 5.10: SukiSU kernel_includes.h includes this unconditionally; KSU does not use static_call. */' \
              '#ifndef _LINUX_STATIC_CALL_STUB_H' \
              '#define _LINUX_STATIC_CALL_STUB_H' \
              '#endif /* _LINUX_STATIC_CALL_STUB_H */' > include/linux/static_call.h
            echo "[+] include/linux/static_call.h 已生成 ($(wc -l < include/linux/static_call.h) 行)"
          else
            echo "[+] static_call.h 已存在"
          fi

          # ── 把 -Werror=<警告> 降级成普通警告 ──
          # run 14 实测：编译推进到 drivers/input/touchscreen 后死在这里：
          #   ftsIO.c:93:29: error: a function declaration without a prototype is
          #   deprecated in all versions of C [-Werror,-Wstrict-prototypes]
          # 4.19 时代的厂商驱动普遍写 `void foo()`，新版 clang 会警告；
          # 而顶层 Makefile 第 942-954 行用 cc-option 把若干警告提成了 -Werror。
          # 刷机不追求零警告，把这类 -Werror= 全部降级，保留真错误。
          WERR=$(grep -cE '^KBUILD_CFLAGS.*-Werror=' Makefile || true)
          echo "=== 降级 -Werror（$WERR 处） ==="
          sed -i -E 's/^(\s*KBUILD_CFLAGS\s*\+=\s*\$\(call cc-option,)-Werror=/\1-W/' Makefile
          grep -nE '^KBUILD_CFLAGS.*-Werror=' Makefile | head -5 || echo "  （已无 -Werror=）"
          # CLANG_FLAGS 里那条也降级
          sed -i -E 's/CLANG_FLAGS\s*\+=\s*-Werror=unknown-warning-option/CLANG_FLAGS += -Wno-unknown-warning-option/' Makefile
          grep -n 'unknown-warning-option' Makefile | head -2

          echo "  AS=${AS:-<unset>} CROSS_COMPILE=${CROSS_COMPILE:-<unset>} CLANG_TRIPLE=${CLANG_TRIPLE:-<unset>}"
          echo "[+] yylloc / -fcommon / -EL / 集成汇编器 修正已应用"

      - name: ⑦ 额外内核选项
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          # 需要加自定义选项时写在这
          echo "[+] Extra kernel options: none"

      - name: ⑧ Re:Kernel（已关）
        if: env.REKERNEL_ENABLE == 'true'
        uses: ./.github/workflows/patch-rekernel

      - name: ⑨ Droidspaces（已关）
        if: env.DROIDSPACES_ENABLE == 'true'
        uses: ./.github/workflows/patch-droidspaces

      - name: ⑩ Baseband Guard
        # ★ 2026-11-16：minimal 档跳过。不能用 `inputs.profile` 做条件 ——
        # GitHub 在作业开始前求值一次 if:，那时 inputs.profile 为空、也读不到 trigger.txt，
        # run32 实测「写了 if: 但 ⑤⑩⑪ 照样全跑」。改用 env.BUILD_PROFILE：
        # 它在 ③-P 里就已经写进 $GITHUB_ENV，且 env.* 在**每次执行步骤时**重新求值。
        if: env.BUILD_PROFILE != 'minimal' && env.BUILD_PROFILE != 'no-bbg'
        uses: ./.github/workflows/patch-baseband-guard

      - name: ⑪ NoMount
        if: env.BUILD_PROFILE != 'minimal' && env.BUILD_PROFILE != 'no-nomount'
        uses: ./.github/workflows/patch-nomount

      - name: ⑫ 编译内核
        uses: ./.github/workflows/build-process

      # ── 产物闸门：不合格不打包、不上传，绝不产出可刷但会黑屏的包 ──
      - name: ⑫-G 产物闸门（不合格不打包）
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          IMG="out/arch/arm64/boot/Image"
          REL="${STOCK_UNAME_RELEASE:-4.19.110-perf+}"
          BUDGET="${{ env.BOOT_IMAGE_BUDGET }}"
          FAIL=0
          p() { echo "  PASS  $1"; }
          f() { echo "  FAIL  $1"; FAIL=1; }

          echo "=== 1. Image ==="
          if [ -s "$IMG" ]; then
            SZ=$(stat -c%s "$IMG")
            p "Image 存在，$SZ B"
            if [ "$SZ" -le "$BUDGET" ]; then
              p "容量 $SZ <= 预算 $BUDGET"
            else
              f "容量 $SZ 超出 boot 分区预算 $BUDGET"
            fi
            strings -a "$IMG" | grep -qF "$REL" && p "内核里含版本串 $REL" || f "内核里没有 $REL（伪装没生效 → 刷了必黑屏）"
            strings -a "$IMG" | grep -qF "IKCFG_ST" && p "IKCONFIG 仍在（后续可再提 config）" || echo "  WARN  无 IKCFG_ST（不影响开机）"

            # ★★★ 最关键的判据：vermagic 必须与手机端 vendor .ko 逐字一致 ★★★
            # 手机实测原厂 .ko 的 vermagic：
            #   4.19.110-perf+ SMP preempt mod_unload modversions aarch64
            # run29 产物是 ... mod_unload aarch64（少 modversions）→ 全部 vendor 驱动拒载 → 掉 EDL。
            # 这一条不过，就不要打包、不要刷 —— 省下的是一次砖。
            echo "  --- vermagic 实测 ---"
            # ★ 注意：$REL 含 '+'（4.19.110-perf+），在 grep -E 里 '+' 是量词会破坏正则。
            # 用 grep -F 取子串（-F 同时避免正则解析），再逐项验关键词。
            # 另：此段必须容忍 grep 无匹配（返回 1），否则 set -e 会让步骤直接退出 —— run30 实测踩过。
            VM_LINE=$(strings -a "$IMG" | grep -F "${REL} SMP preempt" | head -1 || true)
            if [ -z "$VM_LINE" ]; then
              f "Image 里找不到 vermagic 行（应含 '$REL SMP preempt'）"
              echo "  --- 实际含 'SMP preempt' 的行（诊断）---"
              strings -a "$IMG" | grep -F "SMP preempt" | head -5 || echo "      (无)"
              echo "  --- 实际含 '$REL' 的行（诊断）---"
              strings -a "$IMG" | grep -F "$REL" | head -5 || echo "      (无)"
            else
              echo "      实测：$VM_LINE"
              case "$VM_LINE" in
                *modversions*) p "vermagic 含 modversions（与 vendor .ko 一致）" ;;
                *) f "vermagic 缺 modversions → 原厂 .ko 全部拒载 → 必掉 EDL" ;;
              esac
              case "$VM_LINE" in
                *preempt*) p "vermagic 含 preempt" ;;
                *) f "vermagic 缺 preempt" ;;
              esac
              case "$VM_LINE" in
                *mod_unload*) p "vermagic 含 mod_unload" ;;
                *) f "vermagic 缺 mod_unload" ;;
              esac
            fi
          else
            f "Image 不存在：$IMG"
          fi

          echo "=== 2. kernel.release ==="
          KR="out/include/config/kernel.release"
          if [ -f "$KR" ]; then
            GOT=$(cat "$KR")
            [ "$GOT" = "$REL" ] && p "kernel.release = $GOT" || f "kernel.release = $GOT，期望 $REL"
          else
            echo "  WARN  找不到 $KR（部分内核不生成该文件）"
          fi

          echo "=== 3. 编译产物里的模块签名 ==="
          if [ -f out/.config ]; then
            grep -qx 'CONFIG_MODULE_SIG_FORCE=y' out/.config && f "out/.config 里 MODULE_SIG_FORCE 仍为 y → vendor .ko 会被拒载" || p "MODULE_SIG_FORCE 未开"
            grep -qx 'CONFIG_KALLSYMS=y' out/.config && p "out/.config KALLSYMS=y" || f "out/.config 缺 KALLSYMS"
            # ★ MODVERSIONS 必须真的编进内核（不是只在 defconfig 里写了）
            grep -qx 'CONFIG_MODVERSIONS=y' out/.config && p "out/.config MODVERSIONS=y（vermagic 会带 modversions）" || f "out/.config MODVERSIONS 未开 → vermagic 会缺 modversions → 必掉 EDL"
          else
            f "out/.config 不存在，无法确认关键配置"
          fi

          if [ "$FAIL" = "0" ]; then
            echo "[+] 闸门全过，允许打包"
          else
            echo "[-] 闸门拒绝打包：产出物要么黑屏、要么超分区，刷了只会浪费时间与风险"
            exit 1
          fi

      - name: ⑬ 打包 AnyKernel3
        uses: ./.github/workflows/pack-process

      - name: ⑬-V 打包后校验（记录产物指纹）
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          REL="${STOCK_UNAME_RELEASE:-4.19.110-perf+}"
          OUT="$GITHUB_WORKSPACE/artifact-summary.txt"
          {
            echo "# 产物指纹"
            echo "profile        : ${BUILD_PROFILE:-full}"
            echo "uname -r 目标  : $REL"
            echo "版本串来源     : ${VERSION_SOURCE:-fallback}"
            echo "构建时间(UTC)  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## boot.img 来源"
            [ -f boot_sha256.txt ] && cat boot_sha256.txt || echo "(缺失)"
            echo
            echo "## 打包产物"
          } > "$OUT"
          FOUND=0
          for z in $(find "$GITHUB_WORKSPACE" -maxdepth 3 -name '*.zip' -not -path '*/node_modules/*' 2>/dev/null | sort); do
            FOUND=1
            echo "  - $z" >> "$OUT"
            echo "    size   : $(stat -c%s "$z")" >> "$OUT"
            echo "    sha256 : $(sha256sum "$z" | cut -d' ' -f1)" >> "$OUT"
          done
          [ "$FOUND" = "1" ] || { echo "  (没找到 zip，打包可能失败或产物路径变了)" >> "$OUT"; }
          cat "$OUT"

      - name: ⑭ 上传产物
        uses: ./.github/workflows/upload-files

      - name: ⑭-B 上传诊断材料（拒块摘要 / 产物指纹 / 版本串来源）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kebab-diag-${{ github.run_number }}
          path: |
            rej-summary.txt
            artifact-summary.txt
            boot_sha256.txt
          if-no-files-found: warn

      # ── 失败也带齐定位材料，避免"再来一轮看看" ──
      - name: ⑮ 失败摘要（自动收集定位材料）
        if: failure()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p diag
          cp -f device_kernel/out/.config diag/out.config 2>/dev/null || true
          cp -f device_kernel/out/include/config/kernel.release diag/ 2>/dev/null || true
          cp -f "device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" diag/defconfig.used 2>/dev/null || true
          cp -f device_kernel/Makefile diag/Makefile 2>/dev/null || true
          {
            echo "# 失败时定位材料"
            echo "profile     : ${BUILD_PROFILE:-full}"
            echo "版本串来源  : ${VERSION_SOURCE:-fallback}"
            echo "期望 uname  : ${KERNEL_RELEASE_TARGET:-4.19.110-perf+}"
            echo "Makefile 头："
            head -6 diag/Makefile 2>/dev/null || echo "(无)"
            echo
            echo "defconfig 尾部："
            tail -15 diag/defconfig.used 2>/dev/null || echo "(无)"
          } > diag/README.txt
          cat diag/README.txt
      - name: ⑮-B 上传失败材料
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kebab-fail-${{ github.run_number }}
          path: diag/
          if-no-files-found: warn
